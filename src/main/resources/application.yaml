spring:
  application:
    name: api-tabela-tarifaria

  datasource:
    url: ${SPRING_DB_JDBC_URL:jdbc:postgresql://localhost:5432/db_tabela_tarifaria}
    username: ${SPRING_DB_USERNAME:postgres}
    password: ${SPRING_DB_PASSWORD:senhasecreta}
    driver-class-name: org.postgresql.Driver

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    validate-on-migrate: true
    locations: classpath:db/migration
    default-schema: public

  devtools:
    restart:
      enabled: true
      poll-interval: 1s
      quiet-period: 500ms

server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /api